<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>잘보이네 — 스플래시</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 100% at 50% 0%, #F7EFE3 0%, #ECDFCC 100%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #stage { position: relative; }
  #phone { transform-origin: center center; }
</style>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#FDF7EE"/>
    <circle cx="50" cy="50" r="20" fill="#FBA64A"/>
    <circle cx="44" cy="46" r="2.4" fill="#6B3A1A"/>
    <circle cx="56" cy="46" r="2.4" fill="#6B3A1A"/>
    <path d="M44 55 q6 6 12 0" stroke="#6B3A1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </svg>
</template>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="stage"><div id="phone"><div id="root"></div></div></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="splash.jsx"></script>

<script type="text/babel">
const { IOSDevice, SplashC } = window;

const PHONE_W = 402, PHONE_H = 874;

function App() {
  return (
    <IOSDevice dark={false}>
      <SplashC />
    </IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// 화면 크기에 맞춰 폰을 비율 유지하며 맞춤
function fit() {
  const pad = 40;
  const s = Math.min(
    (window.innerWidth  - pad) / PHONE_W,
    (window.innerHeight - pad) / PHONE_H,
    1.25
  );
  document.getElementById('phone').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
